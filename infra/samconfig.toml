# AWS SAM CLI config. Nothing personal here: the admin email is passed at deploy time (make deploy ADMIN_EMAIL=...).
version = 0.1

[default.global.parameters]
stack_name = "sa-jobmarket"
region = "eu-west-1"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
stack_name = "sa-jobmarket"
region = "eu-west-1"
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND"
resolve_s3 = true
confirm_changeset = false
fail_on_empty_changeset = false
tags = "project=\"sa-jobmarket\""

[default.delete.parameters]
stack_name = "sa-jobmarket"
region = "eu-west-1"
