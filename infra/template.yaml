AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  SA Job Market Cloud Analytics Platform - serverless, zero-cost (free tier) stack: Adzuna ingestion pipeline,
  DynamoDB single table, HTTP API with Cognito JWT auth, SNS job alerts, React web app on S3 + CloudFront.

Parameters:
  AdminEmail:
    Type: String
    Description: Email for ops alarms and the budget alert. Passed at deploy time, never committed.
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    ConstraintDescription: Must be an email address.
  ScheduleEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Run the pipeline daily at 03:00 UTC (05:00 SAST).
  CreateBudget:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create a USD 1 monthly AWS Budget that emails AdminEmail.
  AdzunaParamPrefix:
    Type: String
    Default: /sa-jobmarket/adzuna
    AllowedPattern: "^/[A-Za-z0-9_./-]+[^/]$"
    Description: SSM path holding the SecureString parameters app_id and app_key (created by hand).

Conditions:
  ScheduleOn: !Equals [!Ref ScheduleEnabled, "true"]
  BudgetOn: !Equals [!Ref CreateBudget, "true"]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: ../backend/src
    MemorySize: 256
    Timeout: 30
    PropagateTags: true
    Tags:
      project: sa-jobmarket
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        LOG_LEVEL: INFO

Resources:
  # ------------------------------------------------------------------ data
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref AWS::StackName
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 10
        WriteCapacityUnits: 10
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
          ProvisionedThroughput: { ReadCapacityUnits: 5, WriteCapacityUnits: 5 }
        - IndexName: GSI2
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
          ProvisionedThroughput: { ReadCapacityUnits: 5, WriteCapacityUnits: 5 }
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - { Key: project, Value: sa-jobmarket }

  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-raw
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: 30
          - Id: expire-curated
            Status: Enabled
            Prefix: curated/
            ExpirationInDays: 90
          - Id: abort-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
      Tags:
        - { Key: project, Value: sa-jobmarket }

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt DataBucket.Arn, !Sub "${DataBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  JobsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - { Key: project, Value: sa-jobmarket }

  JobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 720 # 6 x ProcessFn timeout (120 s)
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobsDeadLetterQueue.Arn
        maxReceiveCount: 3
      Tags:
        - { Key: project, Value: sa-jobmarket }

  # --------------------------------------------------------- notifications
  JobAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: SA Job Alerts
      Tags:
        - { Key: project, Value: sa-jobmarket }

  OpsAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: SA Job Market Ops
      Tags:
        - { Key: project, Value: sa-jobmarket }

  OpsAlertsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OpsAlertsTopic
      Protocol: email
      Endpoint: !Ref AdminEmail

  # ------------------------------------------------------------------ auth
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UserPoolTier: LITE
      DeletionProtection: INACTIVE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      MfaConfiguration: "OFF"
      UserPoolTags:
        project: sa-jobmarket

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      SupportedIdentityProviders: [COGNITO]
      IdTokenValidity: 1
      AccessTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        IdToken: hours
        AccessToken: hours
        RefreshToken: days

  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: admins
      Description: Can start pipeline runs and view run history.

  # ------------------------------------------------------------------- API
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      FailOnWarnings: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
      Tags:
        project: sa-jobmarket

  PublicApiFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Public, cacheable statistics and job routes.
      Handler: handlers.api_public.handler
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource: [!GetAtt Table.Arn, !Sub "${Table.Arn}/index/*"]
      Events:
        Overview:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/public/overview, Auth: { Authorizer: NONE } }
        Skills:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/public/skills, Auth: { Authorizer: NONE } }
        SkillList:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/public/skill-list, Auth: { Authorizer: NONE } }
        Salaries:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/public/salaries, Auth: { Authorizer: NONE } }
        Provinces:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/public/provinces, Auth: { Authorizer: NONE } }
        SkillPairs:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/public/skill-pairs, Auth: { Authorizer: NONE } }
        Trends:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/public/trends, Auth: { Authorizer: NONE } }
        Jobs:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/public/jobs, Auth: { Authorizer: NONE } }
        JobDetail:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/api/public/jobs/{job_id}", Auth: { Authorizer: NONE } }

  PublicApiFnLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PublicApiFn}"
      RetentionInDays: 7

  MeApiFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Signed-in user routes (saved jobs, alerts, delete account).
      Handler: handlers.api_me.handler
      Environment:
        Variables:
          ALERTS_TOPIC_ARN: !Ref JobAlertsTopic
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:BatchWriteItem
              Resource: !GetAtt Table.Arn
            - Effect: Allow
              Action: sns:Subscribe
              Resource: !Ref JobAlertsTopic
            - Effect: Allow
              Action: [sns:Unsubscribe, sns:GetSubscriptionAttributes]
              Resource: [!Ref JobAlertsTopic, !Sub "${JobAlertsTopic}:*"]
      Events:
        ListSaved:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/me/saved-jobs }
        SaveJob:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: "/api/me/saved-jobs/{job_id}" }
        UnsaveJob:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: "/api/me/saved-jobs/{job_id}" }
        ListAlerts:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/me/alerts }
        CreateAlert:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /api/me/alerts }
        DeleteAlert:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: "/api/me/alerts/{alert_id}" }
        DeleteMe:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: /api/me }

  MeApiFnLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MeApiFn}"
      RetentionInDays: 7

  AdminApiFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Admin routes (start a pipeline run, run history). Requires the admins group.
      Handler: handlers.api_admin.handler
      Environment:
        Variables:
          # Built from the fixed name rather than !Ref PipelineStateMachine: AggregateFn references the
          # Distribution, which references HttpApi, which references this function - a !Ref would close the loop.
          STATE_MACHINE_ARN: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-pipeline"
          DLQ_URL: !Ref JobsDeadLetterQueue
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: [states:StartExecution, states:ListExecutions]
              Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-pipeline"
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt Table.Arn
            - Effect: Allow
              Action: sqs:GetQueueAttributes
              Resource: !GetAtt JobsDeadLetterQueue.Arn
      Events:
        StartRun:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /api/admin/runs }
        ListRuns:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/admin/runs }

  AdminApiFnLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AdminApiFn}"
      RetentionInDays: 7

  # -------------------------------------------------------------- pipeline
  IngestFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Fetch Adzuna ZA jobs (or bundled sample), store raw JSONL.gz and queue one message per job.
      Handler: handlers.ingest.handler
      Timeout: 600
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          QUEUE_URL: !Ref JobsQueue
          ADZUNA_PARAM_PREFIX: !Ref AdzunaParamPrefix
          ADZUNA_MAX_CALLS: "40"
          ADZUNA_MAX_PAGES: "5"
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: ssm:GetParameters
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AdzunaParamPrefix}/*"
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${DataBucket.Arn}/raw/*"
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt JobsQueue.Arn
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt Table.Arn

  IngestFnLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${IngestFn}"
      RetentionInDays: 7

  ProcessFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Enrich queued jobs, write curated JSONL.gz and insert new jobs into DynamoDB.
      Handler: handlers.process.handler
      Timeout: 120
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          MAX_RECEIVE_COUNT: "3"
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${DataBucket.Arn}/curated/*"
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt Table.Arn
      Events:
        Jobs:
          Type: SQS
          Properties:
            Queue: !GetAtt JobsQueue.Arn
            BatchSize: 50
            MaximumBatchingWindowInSeconds: 10
            ScalingConfig:
              MaximumConcurrency: 2
            FunctionResponseTypes: [ReportBatchItemFailures]

  ProcessFnLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProcessFn}"
      RetentionInDays: 7

  AggregateFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Compute the public statistics from the last 37 days of curated files.
      Handler: handlers.aggregate.handler
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          DISTRIBUTION_ID: !Ref Distribution
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt DataBucket.Arn
              Condition:
                StringLike:
                  "s3:prefix": ["curated/*"]
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
              Resource: !Sub "${DataBucket.Arn}/curated/*"
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:BatchWriteItem]
              Resource: !GetAtt Table.Arn
            - Effect: Allow
              Action: cloudfront:CreateInvalidation
              Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  AggregateFnLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AggregateFn}"
      RetentionInDays: 7

  PipelineStatusFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Step Functions helper - queue depth check and RUN# status updates.
      Handler: handlers.pipeline_status.handler
      Environment:
        Variables:
          QUEUE_URL: !Ref JobsQueue
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: sqs:GetQueueAttributes
              Resource: !GetAtt JobsQueue.Arn
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt Table.Arn

  PipelineStatusFnLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PipelineStatusFn}"
      RetentionInDays: 7

  AlertMatcherFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Match newly inserted jobs against user alerts and email one digest per user.
      Handler: handlers.alert_matcher.handler
      Timeout: 60
      Environment:
        Variables:
          ALERTS_TOPIC_ARN: !Ref JobAlertsTopic
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt Table.Arn
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref JobAlertsTopic
      Events:
        NewJobs:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt Table.StreamArn
            StartingPosition: LATEST
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 30
            MaximumRetryAttempts: 2
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName": ["INSERT"], "dynamodb": {"Keys": {"PK": {"S": [{"prefix": "JOB#"}]}}}}'

  AlertMatcherFnLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AlertMatcherFn}"
      RetentionInDays: 7

  PipelineStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${AWS::StackName}-pipeline" # AdminApiFn builds the ARN from this name
      Type: STANDARD
      DefinitionUri: statemachine/pipeline.asl.json
      DefinitionSubstitutions:
        IngestFnArn: !GetAtt IngestFn.Arn
        AggregateFnArn: !GetAtt AggregateFn.Arn
        PipelineStatusFnArn: !GetAtt PipelineStatusFn.Arn
        OpsTopicArn: !Ref OpsAlertsTopic
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref IngestFn }
        - LambdaInvokePolicy: { FunctionName: !Ref AggregateFn }
        - LambdaInvokePolicy: { FunctionName: !Ref PipelineStatusFn }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt OpsAlertsTopic.TopicName }
      Events:
        Daily:
          Type: ScheduleV2
          Properties:
            Description: Daily SA job market pipeline run at 05:00 SAST.
            ScheduleExpression: cron(0 3 * * ? *)
            ScheduleExpressionTimezone: UTC
            State: !If [ScheduleOn, ENABLED, DISABLED]
            Input: '{"use_sample": false}'
      Tags:
        project: sa-jobmarket

  # -------------------------------------------------------------- web/CDN
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: abort-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
      Tags:
        - { Key: project, Value: sa-jobmarket }

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt WebBucket.Arn, !Sub "${WebBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }
          - Sid: AllowCloudFrontOacRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-spa-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for client-side routes (paths whose last segment has no file extension).
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var last = uri.substring(uri.lastIndexOf('/') + 1);
          if (last.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  ApiPublicCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-api-public"
        Comment: Public API - cache by full query string, honour origin Cache-Control.
        MinTTL: 0
        DefaultTTL: 900
        MaxTTL: 3600
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig: { HeaderBehavior: none }
          CookiesConfig: { CookieBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: all }

  ApiPrivateCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-api-private"
        Comment: >
          Signed-in/admin API - never cached (origin sends no-store). Authorization is in the key so CloudFront
          forwards it on GET requests too.
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers: [Authorization]
          CookiesConfig: { CookieBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: all }

  ApiPublicOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-api-public"
        Comment: Forward query strings to the HTTP API, but not Host or cookies.
        HeadersConfig: { HeaderBehavior: none }
        CookiesConfig: { CookieBehavior: none }
        QueryStringsConfig: { QueryStringBehavior: all }

  # The managed SecurityHeadersPolicy plus a Content-Security-Policy for the single-page app.
  # connect-src allows Cognito's endpoint because the browser signs in to it directly (SRP).
  WebSecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-web-security-headers"
        Comment: HSTS, nosniff, frame DENY, referrer policy, XSS protection and CSP for the web app.
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cognito-idp.${AWS::Region}.amazonaws.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
          ContentTypeOptions:
            Override: true
          FrameOptions:
            Override: true
            FrameOption: DENY
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
          XSSProtection:
            Override: true
            Protection: true
            ModeBlock: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: SA Job Market web app and API
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Sub "${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref WebSecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/public/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref ApiPublicCachePolicy
            OriginRequestPolicyId: !Ref ApiPublicOriginRequestPolicy
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: false
            CachePolicyId: !Ref ApiPrivateCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - { Key: project, Value: sa-jobmarket }

  # ------------------------------------------------- alarms (6 metrics, free tier is 10)
  DlqMessagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Jobs that failed processing 3 times are waiting in the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt JobsDeadLetterQueue.QueueName }
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertsTopic]

  PipelineFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A pipeline (Step Functions) execution failed.
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - { Name: StateMachineArn, Value: !Ref PipelineStateMachine }
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertsTopic]

  ProcessErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The SQS process Lambda raised errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref ProcessFn }
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertsTopic]

  AlertMatcherErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The alert matcher Lambda raised errors (job alert emails may be missing).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref AlertMatcherFn }
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertsTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The HTTP API returned 5xx responses.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - { Name: ApiId, Value: !Ref HttpApi }
        - { Name: Stage, Value: $default }
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertsTopic]

  TableReadThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >
        DynamoDB read requests were throttled (users may see slow or failed pages). Write throttling during
        pipeline runs is absorbed by SQS retries and surfaces through the DLQ alarm instead.
      Namespace: AWS/DynamoDB
      MetricName: ReadThrottleEvents
      Dimensions:
        - { Name: TableName, Value: !Ref Table }
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertsTopic]

  # ---------------------------------------------------------------- budget
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: BudgetOn
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly-1usd"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 1
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 1
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AdminEmail }
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AdminEmail }

Outputs:
  CloudFrontUrl:
    Description: Web app URL (the API is under /api on the same origin).
    Value: !Sub "https://${Distribution.DomainName}"
  DistributionId:
    Value: !Ref Distribution
  WebBucketName:
    Value: !Ref WebBucket
  DataBucketName:
    Value: !Ref DataBucket
  TableName:
    Value: !Ref Table
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  StateMachineArn:
    Value: !Ref PipelineStateMachine
  HttpApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  Region:
    Value: !Ref AWS::Region
